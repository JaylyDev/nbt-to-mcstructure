[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nbt-to-mcstructure"
version = "0.6.5"
requires-python = ">=3.11"
dependencies = [
    "markdown-it-py==3.0.0",
    "mdurl==0.1.2",
    "mutf8==1.0.6",
    "pygments==2.20.0",
    "rich==14.0.0",
]

[project.optional-dependencies]
dev = ["pillow"]

[tool.setuptools]
package-dir = {"" = "cli"}

[tool.setuptools.packages.find]
where = ["cli"]


[dependency-groups]
dev = ["pytest==9.2.0"]

[tool.pytest]
strict = true
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
pythonpath = ["cli"]
